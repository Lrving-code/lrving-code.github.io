name: Publish academic homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - name: Verify static homepage
        run: |
          test -s _site/index.html
          test -s _site/favicon.svg
          test -d _site/_next/static
          test -s _site/research/harness-if-overview.png
          grep -q 'https://lrving-code.github.io' _site/index.html
          if grep -qi 'noindex' _site/index.html; then exit 1; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
